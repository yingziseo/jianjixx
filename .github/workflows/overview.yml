name: 素材总览

# 手动运行：按型号并行下载全部素材（R1-PRO 素材多，拆 4 份），输出分辨率清单 + 每秒一帧缩略图（素材本身不上传）
on:
  workflow_dispatch:

jobs:
  overview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: Mad-Shark, shard: "0/1"}
          - {model: R18, shard: "0/1"}
          - {model: Movelck, shard: "0/1"}
          - {model: R1-PRO, shard: "0/4"}
          - {model: R1-PRO, shard: "1/4"}
          - {model: R1-PRO, shard: "2/4"}
          - {model: R1-PRO, shard: "3/4"}
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ffmpeg、字体、Pillow、Playwright
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
          pip install -q pillow
          npm install --silent --no-save playwright-core@1.47.2
      - name: 下载素材并生成总览
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node scripts/feishu_sync.cjs --out materials --model "${{ matrix.model }}" --shard "${{ matrix.shard }}"
          python3 scripts/footage_overview.py materials sheets
          cp materials/manifest.json sheets/
      - uses: actions/upload-artifact@v4
        with:
          name: overview-${{ matrix.model }}-${{ strategy.job-index }}
          path: sheets/
          retention-days: 14
